<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Cupid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#2B1240;--pk:#FF3D8B;--pd:#E02E6F;--y:#FFF1B8;--l:#B9A2FF;--m:#6EF0C2;--w:#fff;--sh:4px 4px 0 var(--p);--f:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;--h:'Caveat','Comic Sans MS',cursive;--dots:radial-gradient(rgba(43,18,64,.14) 1.2px,transparent 1.2px) 0 0/10px 10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:var(--dots),var(--y);color:var(--p);font:700 16px Nunito,system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}svg{display:block}i{font-style:normal}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.hide{display:none!important}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes bob{50%{transform:translateY(-8px)}}
body.rm *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{font:400 22px var(--f);background:var(--pk);color:#fff;border:4px solid var(--p);border-radius:99px;padding:12px 28px;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
.btn:active,.ac:active{transform:translate(4px,4px);box-shadow:none}.btn.s{font-size:16px;padding:8px 18px}
.cd{background:#fff;border:4px solid var(--p);border-radius:24px;box-shadow:6px 6px 0 var(--p)}
/* intro */
#intro{position:fixed;inset:0;z-index:99;background:var(--dots),var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s;overflow:hidden;cursor:pointer}
.ib{position:relative;display:flex}.ib .l{animation:inL 1s cubic-bezier(.34,1.56,.64,1) both}.ib .r{animation:inR 1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes inL{0%{transform:translateX(-70vw) rotate(-25deg)}70%{transform:translateX(14px) rotate(7deg)}100%{transform:none}}@keyframes inR{0%{transform:translateX(70vw) rotate(25deg)}70%{transform:translateX(-14px) rotate(-7deg)}100%{transform:none}}
.hp{position:absolute;left:50%;top:-24px;width:48px;transform:translateX(-50%) scale(0);animation:hpop .6s 1s forwards}@keyframes hpop{60%{transform:translateX(-50%) scale(1.4)}100%{transform:translateX(-50%) scale(1)}}
#ti{font:400 clamp(48px,11vw,104px) var(--f);color:var(--pk);-webkit-text-stroke:8px var(--p);paint-order:stroke fill;text-shadow:6px 6px 0 var(--p);display:flex}
#ti span{display:inline-block;animation:drop .6s cubic-bezier(.34,1.56,.64,1) both}@keyframes drop{0%{transform:translateY(-140px) scaleY(1.4);opacity:0}60%{transform:scale(1.2,.75);opacity:1}100%{transform:none}}
#tg{font:700 28px var(--h);min-height:34px;text-align:center;padding:0 12px}#go{opacity:0;transform:rotate(-3deg);animation:pop .5s 3.2s forwards}
#wp{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--pk);transform:translate(-50%,-50%) scale(0);transition:transform .65s ease-in;pointer-events:none}#wp.on{transform:translate(-50%,-50%) scale(120)}
/* chrome */
header{position:sticky;top:0;z-index:50;background:var(--y);border-bottom:3px solid var(--p);padding:10px 20px;display:flex;align-items:center;gap:14px}
.logo{font:400 26px var(--f);color:var(--pk);-webkit-text-stroke:5px var(--p);paint-order:stroke fill;display:flex;align-items:center;gap:8px;margin-right:auto}.logo svg{width:28px;fill:var(--pk);stroke:var(--p);stroke-width:2}
nav.top{display:flex;gap:6px}nav.top a{font:400 16px var(--f);padding:8px 18px;border:3px solid transparent;border-radius:99px}nav a.on{background:var(--pk);color:#fff;border-color:var(--p);box-shadow:3px 3px 0 var(--p)}
.tk{background:#fff;border:3px solid var(--p);border-radius:12px;padding:5px 12px;font:400 15px var(--f);box-shadow:3px 3px 0 var(--p);white-space:nowrap}.lv{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pk);animation:pu 1s infinite}@keyframes pu{50%{transform:scale(1.6);opacity:.5}}
.rb{width:42px;height:42px;border:3px solid var(--p);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--p);display:grid;place-items:center}
.bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:3px solid var(--p);justify-content:space-around;padding:8px 0 12px}
.bar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;padding:6px 14px;border-radius:99px;transition:transform .2s}.bar a.on{transform:translateY(-6px)}
main{max-width:1180px;margin:0 auto;padding:28px 20px}.scr{display:none}.scr.on{display:block;animation:up .4s both}
h2{font:400 clamp(30px,4vw,46px) var(--f);color:var(--pk);-webkit-text-stroke:8px var(--p);paint-order:stroke fill;text-shadow:4px 4px 0 var(--p);margin-bottom:20px}
footer{text-align:center;font-size:12px;padding:0 0 24px;opacity:.7}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start}.two.d{grid-template-columns:300px minmax(0,1fr)}
@media(max-width:1023px){nav.top{display:none}.bar{display:flex}.two,.two.d{grid-template-columns:1fr}footer{padding-bottom:100px}.tk{font-size:13px}}
/* mascot */
.mc{animation:bob 3s ease-in-out infinite}.talk{animation:bob .6s ease-in-out infinite}.ey,.mo{transform-box:fill-box;transform-origin:center}.ey{animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.talk .mo{animation:mo .25s infinite alternate}@keyframes mo{to{transform:scaleY(2.6)}}
/* people */
#st{position:relative;width:min(340px,86vw);height:510px;margin:6px auto 28px}
.c{position:absolute;inset:0;background:#fff;border:4px solid var(--p);border-radius:24px;box-shadow:6px 6px 0 var(--p);overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s;display:flex;flex-direction:column}
.ph{height:270px;border-bottom:4px solid var(--p);border-radius:170px 170px 0 0;position:relative;flex:none;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;pointer-events:none}.mb{position:absolute;right:8px;bottom:4px}
.tag{position:absolute;top:16px;left:18px;background:var(--y);border:3px solid var(--p);border-radius:10px;padding:2px 10px;font:400 13px var(--f);box-shadow:3px 3px 0 var(--p);transform:rotate(-6deg)}
.inf{padding:12px 16px;display:flex;flex-direction:column;gap:6px}.nm{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.nm b{font:400 26px var(--f)}
.role{background:var(--y);border:3px solid var(--p);border-radius:10px;padding:2px 10px;font:400 13px var(--f);transform:rotate(-2deg)}.bio{font:700 23px/1 var(--h)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:3px solid var(--p);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800;box-shadow:2px 2px 0 var(--p);background:var(--m)}.chip:nth-child(2){background:var(--l)}.chip:nth-child(3){background:var(--y)}
.sm{position:absolute;top:70px;font:400 32px var(--f);border:5px solid;border-radius:10px;padding:0 10px;opacity:0;pointer-events:none;z-index:5;background:rgba(255,255,255,.9)}.sm.y{left:14px;color:#17b26a;transform:rotate(-14deg)}.sm.n{right:14px;color:#f23;transform:rotate(14deg)}
.acts{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.ac{width:60px;height:60px;border-radius:50%;border:4px solid var(--p);background:#fff;box-shadow:var(--sh);display:grid;place-items:center;transition:transform .1s,box-shadow .1s}
.ac.n{background:#ff8a7a}.ac.u{background:var(--y)}.ac.l{background:var(--pk);color:#fff;width:72px;height:72px}.ac.l svg{fill:#fff}.ac.s{background:var(--l)}.ac svg{width:28px;height:28px}
.bh{position:fixed;width:20px;pointer-events:none;z-index:90;animation:bh .7s ease-out forwards}@keyframes bh{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.wy{padding:20px}.wy h3{font:400 22px var(--f);color:var(--pd);margin-bottom:10px}.wy h4{font:400 15px var(--f);margin:10px 0 4px}
.sp{display:flex;gap:10px;align-items:center;font:700 22px/1.1 var(--h);background:var(--y);border:3px solid var(--p);border-radius:16px;padding:8px 12px}
.pl{display:inline-flex;align-items:center;gap:5px;border:3px solid var(--p);border-radius:99px;padding:3px 10px 3px 5px;font-size:13px;font-weight:800;margin:0 4px 6px 0;box-shadow:2px 2px 0 var(--p)}
.s{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;font:800 9px sans-serif;color:#fff}.s.li{background:#0A66C2}.s.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}
/* dates */
.di{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--p);border-radius:16px;padding:8px 10px;margin-top:12px;cursor:pointer;box-shadow:var(--sh)}.di.on{background:#ffd0e3}
.di img,.pa,.ha{width:40px;height:40px;border-radius:50%;border:2px solid var(--p);object-fit:cover;background:#ffc2dc}.di img+img{margin-left:-20px}.dn{font:400 16px var(--f)}.di small{font-weight:800;color:var(--pd)}.lvt{animation:pu 1s infinite}
.stg{height:560px;display:flex;flex-direction:column;position:relative;overflow:hidden}.sc{position:absolute;top:14px;right:14px;background:#fff;border:3px solid var(--p);border-radius:10px;padding:2px 10px;font:400 14px var(--f);transform:rotate(3deg);z-index:2}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:56px 18px 10px;overflow:hidden}
.bb{max-width:74%;border:3px solid var(--p);border-radius:18px;padding:8px 14px;font:700 23px/1.05 var(--h);box-shadow:3px 3px 0 var(--p);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}.bb.a{align-self:flex-start;background:#ffc2dc}.bb.b{align-self:flex-end;background:#d9cdff}.bb.old{opacity:.55}
.ty i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--p);margin:0 2px;animation:bn .8s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-6px)}}
.act{display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px 14px;height:200px;position:relative}.act>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.an{font:400 14px var(--f);background:#fff;border:3px solid var(--p);border-radius:10px;padding:1px 10px}
.gg{position:absolute;left:50%;bottom:34px;width:104px;transform:translateX(-50%);overflow:visible}.gn{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font:400 20px var(--f)}
#lq{transform-box:fill-box;transition:transform .8s cubic-bezier(.34,1.56,.64,1)}.fl{position:absolute;left:50%;bottom:150px;font-size:32px;animation:fl 1s forwards;z-index:3}@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.vd{position:absolute;inset:0;background:rgba(43,18,64,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:4;animation:pop .4s both;color:#fff}
.stp{font:400 clamp(34px,6vw,52px) var(--f);color:var(--pk);border:6px solid var(--pk);padding:2px 18px;border-radius:12px;transform:rotate(-8deg);background:#fff}.vd p{font:700 26px var(--h)}
.cf{position:absolute;top:-14px;width:10px;height:14px;animation:fall 1.8s linear forwards;z-index:5}@keyframes fall{to{transform:translateY(580px) rotate(540deg)}}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px}.ctl .ac{width:46px;height:46px}.ctl .ac svg{width:22px;height:22px}
.sb{border:3px solid var(--p);border-radius:12px;padding:6px 14px;font:400 16px var(--f);background:#fff;box-shadow:3px 3px 0 var(--p)}.sb.on{background:var(--pk);color:#fff}
.mo2{position:fixed;inset:0;z-index:80;background:rgba(43,18,64,.6);display:grid;place-items:center;padding:16px;overflow:auto}.mdl{width:min(660px,100%);padding:24px;position:relative;text-align:center}.mdl h2{font-size:34px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.ms{background:#ffeef5;border:3px solid var(--p);border-radius:16px;height:110px;display:flex;align-items:center;justify-content:space-around;padding:4px}.ms b{font:400 22px var(--f);color:var(--pd);animation:pop .3s}.cn{font:400 22px var(--f)}
.x{position:absolute;top:10px;right:14px;font:400 30px var(--f)}
/* matches */
.nar{max-width:820px;margin:0 auto}.pr{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}select{font:400 16px var(--f);padding:8px 12px;border:3px solid var(--p);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--p)}
#pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:30px 0 28px}.pc{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(200px,30vw);text-align:center}.pc .pa{width:76px;height:76px;border-width:3px}
.pn{font:400 20px var(--f)}.gs{font:700 18px/1 var(--h)}.cr{height:34px;display:grid;place-items:center}.cr svg{width:34px}
.md{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:3px solid var(--p);background:#ddd;font:400 14px var(--f)}
.bk{width:100%;border:4px solid var(--p);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:var(--sh);display:grid;place-items:center;font:400 34px var(--f);transform-origin:bottom;animation:rise .6s both}@keyframes rise{from{transform:scaleY(0)}}
.rg{border-radius:50%;background:conic-gradient(var(--pk) calc(var(--v)*1%),#eee 0);display:grid;place-items:center;border:3px solid var(--p);position:relative;flex:none}.rg::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}.rg b{position:relative;font:400 16px var(--f)}
.rw{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--p);border-radius:16px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh)}.rk{width:34px;height:34px;border-radius:50%;background:var(--pk);color:#fff;border:3px solid var(--p);display:grid;place-items:center;font:400 16px var(--f);flex:none}
.gr{flex:1;min-width:0}.gr b{font:400 18px var(--f)}.gr small{display:block;font:700 19px/1 var(--h)}.lk{font:400 14px var(--f);color:var(--pd);text-decoration:underline}
.hm{display:grid;grid-template-columns:36px repeat(8,1fr);gap:6px;align-items:center;padding:16px;overflow:visible}.ha{width:32px;height:32px}
.hc{aspect-ratio:1;border:2px solid var(--p);border-radius:8px;position:relative;cursor:pointer;animation:pop .4s both;animation-delay:calc(var(--d)*40ms)}.hc.self{background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 4px 8px);cursor:default}
.hc:hover::after{content:attr(data-t);position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:4px 8px;border-radius:8px;white-space:nowrap;font-size:12px;z-index:5}
.me{max-width:420px;margin:0 auto;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}.me p{font:700 24px/1.1 var(--h)}
</style></head>
<body class="lock">
<div id="intro"><div class="ib" id="ib"></div><h1 id="ti"></h1><p id="tg"></p><button class="btn" id="go">Let's go</button><div id="wp"></div></div>
<header><div class="logo"><svg viewBox="0 0 24 24"><path id="hh" d=""/></svg>Agent Cupid</div>
<nav class="top"><a href="#people">People</a><a href="#dates">Dates</a><a href="#matches">Matches</a><a href="#me">Me</a></nav>
<span class="tk"><i class="lv"></i> <b id="tk">317</b> dates today</span><button class="rb" id="rm" title="Reduce motion" aria-label="Reduce motion" data-i="act"></button></header>
<main>
<section class="scr" id="s-people"><h2>Meet your matches</h2><div class="two"><div><div id="st"></div>
<div class="acts"><button class="ac n" aria-label="Nope" data-i="x"></button><button class="ac u" aria-label="Undo" data-i="undo"></button><button class="ac l" aria-label="Like" data-i="heart"></button><button class="ac s" aria-label="Super like" data-i="bolt"></button></div></div>
<div class="cd wy" id="wy"></div></div></section>
<section class="scr" id="s-dates"><h2>Agent Dates</h2><div class="two d"><div><button class="btn" id="sp" style="background:var(--y);color:var(--p)">Speed-Dating Round</button><div id="dl"></div></div>
<div><div class="cd stg" id="sg"><span class="sc" id="sl"></span><div class="chat" id="ch"></div>
<div class="act"><div id="ma"></div><svg class="gg" viewBox="0 0 24 24"><defs><clipPath id="hc"><path class="H"/></clipPath></defs><path class="H" fill="#fff"/><g clip-path="url(#hc)"><rect id="lq" width="24" height="24" fill="#FF3D8B" style="transform:translateY(100%)"/></g><path class="H" fill="none" stroke="#2B1240" stroke-width="1.2"/></svg><b class="gn" id="gn">0%</b><div id="mb"></div></div>
<div class="vd hide" id="vd"></div></div>
<div class="ctl"><button class="ac" id="pp" aria-label="Play or pause"></button><button class="sb on" data-s="1">1x</button><button class="sb" data-s="2">2x</button><button class="sb" data-s="4">4x</button><button class="ac" id="rp" aria-label="Replay" data-i="re"></button></div></div></div></section>
<section class="scr" id="s-matches"><div class="nar"><h2>Top matches</h2><div class="pr"><label for="pk">Matches for</label><select id="pk"></select><button class="sb" id="tg2">Show heatmap</button></div>
<div id="lst"><div id="pod"></div><div id="rl"></div></div><div class="cd hm hide" id="hm"></div></div></section>
<section class="scr" id="s-me"><div class="cd me" id="me"></div></section>
</main>
<footer>Demo seed profiles · verify public-profile sources before submission.</footer>
<nav class="bar"><a href="#people" data-i="users" data-t="People"></a><a href="#dates" data-i="chat" data-t="Dates"></a><a href="#matches" data-i="heart" data-t="Matches"></a><a href="#me" data-i="user" data-t="Me"></a></nav>
<script>
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];
const HP="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
$('#hh').setAttribute('d',HP);$$('.H').forEach(e=>e.setAttribute('d',HP));
const HS=`<svg viewBox="0 0 24 24" fill="#FF3D8B" stroke="#2B1240" stroke-width="2"><path d="${HP}"/></svg>`;
const CR=`<svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-5 4L12 5 9.5 12l-5-4z" fill="#FFC93C" stroke="#2B1240" stroke-width="2" stroke-linejoin="round"/></svg>`;
const IC={x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',heart:`<path d="${HP}"/>`,bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',play:'<path d="M6 3l14 9-14 9z"/>',pause:'<path d="M14 4h4v16h-4zM6 4h4v16H6z"/>',re:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'};
const I=k=>`<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`;
